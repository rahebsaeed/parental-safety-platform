# Parental Safety Platform — nginx reverse proxy
#
# Serves:
#   - React dashboard (static files from dist/) on http://192.168.1.20/
#   - FastAPI backend proxied at http://192.168.1.20/api/
#   - WebSocket upgrades at http://192.168.1.20/api/ws
#
# LAN + Tailnet: listen on all local interfaces (LAN 192.168.1.20,
# Tailscale 100.x, localhost). Still NOT internet-exposed: the DSL router
# forwards no ports, and uvicorn stays on 127.0.0.1:8000 behind this proxy.
# Phase 12 (Tailscale) remote access rides the Tailnet interface only.
#
# Install:
#   sudo cp this file /etc/nginx/sites-available/parental-monitor
#   sudo ln -sf /etc/nginx/sites-available/parental-monitor \
#               /etc/nginx/sites-enabled/parental-monitor
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 192.168.1.20;

    # -------------------------------------------------------
    # React dashboard — pre-built static files
    # -------------------------------------------------------
    root /opt/parental-safety/frontend/dist;
    index index.html;

    # All unmatched routes serve index.html (React SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # API proxy → uvicorn on 127.0.0.1:8000
    # -------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard reverse proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (for /api/ws)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # Timeouts — generous for SSE long-poll and WebSocket idle
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Disable buffering for SSE / streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    access_log /var/log/nginx/parental-monitor-access.log;
    error_log  /var/log/nginx/parental-monitor-error.log warn;
}

# WebSocket connection upgrade map (put this in nginx.conf http block if not
# already present — install.sh adds it automatically):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
