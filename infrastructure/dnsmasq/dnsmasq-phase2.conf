# dnsmasq configuration — Phase 2 DNS Observation
#
# Purpose: Run a logging-only DNS forwarder on Ubuntu's LAN IP
# (192.168.1.20:53) that:
#   - forwards all queries upstream so it is never a single point of failure
#   - logs every query with enough fields for the Phase 2 ingester to parse
#   - does NOT serve DHCP (DNS-only mode)
#   - does NOT act as an authoritative server for any domain
#
# IMPORTANT: Never start this before confirming port 53 is free on
# 192.168.1.20 (run infrastructure/dnsmasq/setup.sh which checks first).
# Pointing the router's DHCP DNS at this address before the service is
# running caused the 2026-09-12 household-wide outage — do not repeat it.

# ── Bind only to Ubuntu's LAN IP, not to loopback or any other interface.
#    This avoids colliding with systemd-resolved on 127.0.0.53 and keeps
#    the service off the loopback so we don't accidentally intercept local
#    resolver traffic.
listen-address=192.168.1.20
bind-interfaces

# No-daemon mode is controlled by the caller (setup.sh / systemd unit).
# Do not set `no-daemon` here — it prevents start as a background service.

# ── DNS-only: disable every DHCP/TFTP/BOOTP feature explicitly so a
#    misconfigured future run can't accidentally become a rogue DHCP server.
no-dhcp-interface=wlp0s20f3
no-hosts

# ── Upstream resolvers.
#    Forward everything upstream; dnsmasq itself holds no cached answers
#    that could become stale or authoritative.
#    Using Google Public DNS here; replace with ISP DNS if preferred.
server=8.8.8.8
server=8.8.4.4

# ── Logging.
#    log-queries: emit one line per query AND one line per reply — the
#    ingester needs both to reconstruct resolved_addresses and response_status.
#    log-facility: send to a dedicated file rather than syslog so the ingester
#    can tail it without syslog noise.
log-queries
log-facility=/var/log/parental-safety/dnsmasq.log

# ── No local /etc/hosts expansion (we only want real DNS queries logged,
#    not host-file lookups which would pollute the DNS observation data).
no-resolv

# ── Cache: keep a small cache so upstream isn't hammered, but the cache is
#    transparent to the logger — every cache hit still appears in the log.
cache-size=1000

# ── PID file used by setup.sh to manage the process lifetime.
pid-file=/run/parental-safety-dnsmasq.pid
