# dnsmasq configuration - Phase 2 DNS Observation + DHCP
# Serves DNS forwarding and DHCP on the LAN interface.
# The router's built-in DHCP must be disabled for this to work.

# DNS forwarders
server=8.8.8.8
server=8.8.4.4
no-resolv

# Logging
log-queries
log-facility=/var/log/parental-safety/dnsmasq.log

# DNS cache
cache-size=1000
pid-file=/run/parental-safety-dnsmasq.pid

# DHCP server
dhcp-range=192.168.1.100,192.168.1.200,12h
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.20
